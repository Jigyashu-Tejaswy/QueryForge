name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for coordinator to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Coordinator is healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Coordinator did not become healthy in time"
          docker compose logs coordinator
          exit 1

      - name: Verify workers registered
        run: |
          sleep 15
          WORKERS=$(curl -sf http://localhost:3000/api/workers | python3 -c "import sys,json; data=json.load(sys.stdin); print(len([w for w in data if w.get('liveStatus')=='active']))")
          echo "Active workers: $WORKERS"
          if [ "$WORKERS" -lt "1" ]; then
            echo "No active workers registered"
            docker compose logs worker-1 worker-2 worker-3
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v
